<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Mvdy Reels</title>
    <style>
      body { width: 320px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; background: #fff; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #6b7280; font-size: 12px; margin-bottom: 12px; }
      label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; margin: 10px 0 4px; }
      input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
      .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
      button { font: inherit; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
      button.primary { background: #006DBC; color: #fff; border-color: #006DBC; }
      .status { margin-top: 10px; font-size: 12px; color: #374151; background: #f3f4f6; border-radius: 8px; padding: 8px 10px; white-space: pre-line; }
      .ok { color: #16a34a; } .err { color: #dc2626; }
      .toggle { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 12.5px; line-height: 1.35; } .toggle input { margin-top: 2px; }
      .tip { color: #6b7280; font-size: 11.5px; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>Mvdy Reels</h1>
    <div class="sub">Scrolle tes Reels sur instagram.com : ils arrivent dans ton tool, tu les tries en mode Tinder.</div>

    <label for="baseUrl">Adresse du tool</label>
    <input id="baseUrl" type="text" placeholder="https://mvdyprince.fr" />

    <label for="token">Jeton (tool → Reels → Extension)</label>
    <input id="token" type="password" placeholder="colle le jeton ici" />

    <div class="row">
      <button id="save" class="primary">Enregistrer</button>
      <button id="test">Tester la connexion</button>
    </div>

    <label class="toggle"><input id="autopilot" type="checkbox" /> <span><b>Pilote automatique</b> : scroller les Reels tout seul quand un onglet instagram.com/reels est ouvert (2 à 4 s par Reel, 150 / heure max). Laisse l'onglet ouvert.</span></label>
    <label class="toggle"><input id="autolike" type="checkbox" /> <span><b>Liker depuis le tool</b> : le bouton ♥ du tool ouvre le Reel ici et clique « J'aime » une fois (un vrai like de ton compte).</span></label>
    <label class="toggle"><input id="paused" type="checkbox" /> Mettre la capture en pause</label>

    <div id="status" class="status">…</div>
    <div class="tip">Ouvre <b>instagram.com/reels</b> et scrolle. Chaque Reel vu est envoyé une seule fois (vidéo comprise). Aucun like sans ton clic, rien n'est publié à ta place.</div>
    <script src="popup.js"></script>
  </body>
</html>
